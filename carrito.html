<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carrito · Gatoarisco</title>
<meta name="description" content="Tu carrito de compras en Gatoarisco.">
<meta name="theme-color" content="#0B1A2A">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/marca/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/marca/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="Carrito · Gatoarisco">
<meta property="og:description" content="Tu carrito de compras en Gatoarisco.">
<meta property="og:image" content="https://passbri.github.io/gatoarisco/assets/img/marca/og-gatoarisco.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@300;400&family=Saira:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css?v=202611110413">
</head>
<body data-page="carrito">
<a class="sr-only" href="#main">Saltar al contenido</a>
<header class="site-header" id="site-header"></header>
<main id="main">

<section class="wrap page-head">
  <p class="eyebrow">Tu pedido · lo que atrapaste</p>
  <h1 class="h-display">Carrito</h1>
</section>
<div class="wrap cart-layout">
  <div class="panel brackets" style="padding:8px 18px" id="cart-list"></div>
  <aside class="panel brackets cart-summary" id="cart-summary" style="padding:22px" hidden>
    <h2 class="h-section" style="font-size:20px;margin:0 0 12px">Resumen</h2>
    <div class="summary-row"><span>Subtotal</span><span id="s-subtotal"></span></div>
    <div class="summary-row" id="s-desc-row" hidden><span>Código de embajador</span><span id="s-desc" style="color:var(--mint-text)"></span></div>
    <div class="summary-row"><span>Envío</span><span id="s-envio"></span></div>
    <div class="summary-row total"><span>Total</span><span id="s-total"></span></div>
    <p class="alert alert-mint" style="margin:12px 0 18px"><span class="dot"></span><span id="s-free"></span></p>
    <form id="checkout" novalidate>
      <div class="field"><label for="ref">Código de embajador (opcional)</label><input id="ref" name="ref" autocomplete="off" placeholder="Ej. LAURA25"></div>
      <div class="field"><label for="nombre">Nombre completo</label><input id="nombre" name="nombre" required autocomplete="name"></div>
      <div class="two">
        <div class="field"><label for="telefono">Celular</label><input id="telefono" name="telefono" type="tel" required autocomplete="tel" inputmode="tel"></div>
        <div class="field"><label for="ciudad">Ciudad</label><input id="ciudad" name="ciudad" required autocomplete="address-level2"></div>
      </div>
      <div class="field"><label for="direccion">Dirección de entrega</label><input id="direccion" name="direccion" required autocomplete="street-address"></div>
      <div class="field"><label for="pago">¿Cómo quieres pagar?</label><select id="pago" name="pago"><option>Nequi</option><option>Daviplata</option><option>Transferencia bancaria</option><option>Contraentrega</option></select></div>
      <div class="field"><label for="notas">Notas (opcional)</label><textarea id="notas" name="notas" rows="2"></textarea></div>
      <button class="btn btn-primary" type="submit" style="width:100%">Enviar pedido por WhatsApp</button>
      <p class="note" style="margin:12px 0 0">Arisco, pero honesto: te confirmamos disponibilidad y envío antes de pagar. Muy pronto podrás pagar en línea con tarjeta, PSE y Nequi.</p>
    </form>
  </aside>
</div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<nav class="bottom-nav" id="bottom-nav" aria-label="Navegación inferior"></nav>
<script src="assets/js/config.js?v=202611110413"></script>
<script src="assets/js/gato.js?v=202611110413"></script>
<script src="assets/js/app.js?v=202611110413"></script>
</body>
</html>
